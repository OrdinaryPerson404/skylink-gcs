  </defs>
  <rect x="0" y="0" width="1780" height="1310" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1f2328">SkyLink GCS 详细图④ —— 协议层（CLI 文本解析 · MAVLink 二进制编解码 · 黄金帧护栏）</text>
  <text x="26" y="54" font-size="12" fill="#57606a">双协议并存：串口 CLI 文本协议（40 个预编译正则，真机抓包校准）+ WiFi UDP MAVLink v1/v2 二进制协议（CRC-16/MCRF4XX，pymavlink 黄金帧单测护栏）</text>
  <rect x="60" y="96" width="640" height="310.5" fill="#fbf7fe" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="60" y="96" width="640" height="26" fill="#f3e8fd" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="61" y="113" width="638" height="10" fill="#f3e8fd"/>
  <text x="70" y="114" font-size="12.5" font-weight="bold" fill="#1f2328">CliProtocol  «协议 · CLI 文本解析»</text>
  <text x="72" y="130" font-size="11" fill="#1f2328">+ CMD_PS / CMD_PSQ / CMD_RC / CMD_MOT / CMD_IMU</text>
  <text x="72" y="145.5" font-size="11" fill="#1f2328">+ CMD_STATUS / CMD_PARAMS / CMD_SYS / CMD_WIFI / CMD_TIME</text>
  <text x="72" y="161" font-size="11" fill="#1f2328">- 40 个预编译 Pattern {static final}，例如：</text>
  <text x="72" y="176.5" font-size="11" fill="#1f2328">    P_PS / P_PSQ / P_MOT / P_RC_CH / P_RC_CTRL / P_RC_MODE / P_TIME_LINE</text>
  <text x="72" y="192" font-size="11" fill="#1f2328">    P_CONTROL_SOURCE / P_IMU_MODEL / P_IMU_GYRO / P_IMU_ACC / P_LANDED</text>
  <text x="72" y="207.5" font-size="11" fill="#1f2328">    P_ARMED / P_RC_LINK / P_CRSF_LQ / P_LOOP_RATE / P_ARMING_DISABLED</text>
  <text x="72" y="223" font-size="11" fill="#1f2328">    P_PHASE / P_AIRBORNE / P_BATTERY / P_ALTITUDE / P_PARAM_LINE …</text>
  <text x="72" y="238.5" font-size="11" fill="#1f2328">- n(s) / flag(s) 数值与布尔容错解析 {private static}</text>
  <line x1="60" y1="255" x2="700" y2="255" stroke="#7a4fb5" stroke-width="1"/>
  <text x="72" y="262" font-size="11" fill="#1f2328">+ parseEuler(text): Euler          + parseQuat(text): Quat</text>
  <text x="72" y="277.5" font-size="11" fill="#1f2328">+ parseMotors(text): Motors        + parseRc(text): RcData</text>
  <text x="72" y="293" font-size="11" fill="#1f2328">+ parseImu(text): ImuData          + parseStatus(text): StatusData</text>
  <text x="72" y="308.5" font-size="11" fill="#1f2328">+ parseParams(text): LinkedHashMap&lt;String,Double&gt;</text>
  <text x="72" y="324" font-size="11" fill="#1f2328">+ parseSys(text): SysData          + parseWifi(text): WifiData</text>
  <text x="72" y="343.5" font-size="10.2" fill="#57606a">全部按真机抓包样本校准（workspace/com5_dump.txt 黄金样本）；</text>
  <text x="72" y="358.5" font-size="10.2" fill="#57606a">解析结果为不可变 record（见下方值对象群）；</text>
  <text x="72" y="373.5" font-size="10.2" fill="#57606a">参数行正则：(?m)^([A-Z][A-Z0-9_]+)\s*=\s*(nan|-?[\d.]+…)\s*$</text>
  <rect x="740" y="96" width="560" height="295.5" fill="#fbf7fe" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="740" y="96" width="560" height="26" fill="#f3e8fd" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="741" y="113" width="558" height="10" fill="#f3e8fd"/>
  <text x="750" y="114" font-size="12.5" font-weight="bold" fill="#1f2328">MavLink  «协议 · MAVLink v1/v2 编解码»</text>
  <text x="752" y="130" font-size="11" fill="#1f2328">+ SYSID_GCS = 255 / COMPID_GCS = 190 {static final}</text>
  <text x="752" y="145.5" font-size="11" fill="#1f2328">+ MSG_*：16 个 msgid 常量 {static final}</text>
  <text x="752" y="161" font-size="11" fill="#1f2328">    HEARTBEAT=0 … ATTITUDE_QUATERNION=31 … COMMAND_LONG=76</text>
  <text x="752" y="176.5" font-size="11" fill="#1f2328">    SERIAL_CONTROL=126 … SCALED_IMU=26 … EXTENDED_SYS_STATE=245</text>
  <text x="752" y="192" font-size="11" fill="#1f2328">- CRC_EXTRA 表 + LEARNED 运行时学习 {static final}</text>
  <text x="752" y="207.5" font-size="11" fill="#1f2328">- seq: int {static}   - MavLink() {private}</text>
  <line x1="740" y1="224" x2="1300" y2="224" stroke="#7a4fb5" stroke-width="1"/>
  <text x="752" y="231" font-size="11" fill="#1f2328">+ buildV1(msgid, payload[, extra[, seq, sysid, compid]]): byte[]</text>
  <text x="752" y="246.5" font-size="11" fill="#1f2328">+ crc(crc, buf, off, len) / crcWithExtra(..): int {static}</text>
  <text x="752" y="262" font-size="11" fill="#1f2328">+ payloadHeartbeatGcs / payloadCommandLong / payloadManualControl</text>
  <text x="752" y="277.5" font-size="11" fill="#1f2328">+ payloadParamRequestList / RequestRead / ParamSet</text>
  <text x="752" y="293" font-size="11" fill="#1f2328">+ payloadSerialControlShell(cmd): byte[]</text>
  <text x="752" y="308.5" font-size="11" fill="#1f2328">+ learnedExtra(msgid): Integer  + knownExtra(msgid): int</text>
  <text x="752" y="324" font-size="11" fill="#1f2328">+ rU8 / rU16 / rU32 / rS16 / rF32 / rAscii  二进制读取器</text>
  <text x="752" y="343.5" font-size="10.2" fill="#57606a">CRC-16/MCRF4XX 初值 0xFFFF，CRC_EXTRA 按字节累加（非移位异或）；</text>
  <text x="752" y="358.5" font-size="10.2" fill="#57606a">线上字段序 = 尺寸降序稳定排序；旧固件方言 extra 运行时学习后锁定</text>
  <rect x="1340" y="96" width="200" height="127" fill="#fffdf4" stroke="#a8791b" stroke-width="1.5" rx="6"/>
  <rect x="1340" y="96" width="200" height="26" fill="#fdeeca" stroke="#a8791b" stroke-width="1.5" rx="6"/>
  <rect x="1341" y="113" width="198" height="10" fill="#fdeeca"/>
  <text x="1350" y="114" font-size="12.5" font-weight="bold" fill="#1f2328">CliLink  «链路 · 简引用»</text>
  <text x="1352" y="130" font-size="11" fill="#1f2328">- completeFor(cmd, acc)</text>
  <text x="1352" y="145.5" font-size="11" fill="#1f2328">- apply(cmd, text)</text>
  <line x1="1340" y1="162" x2="1540" y2="162" stroke="#a8791b" stroke-width="1"/>
  <text x="1352" y="167" font-size="10.2" fill="#57606a">«链路 · 消费者»</text>
  <text x="1352" y="182" font-size="10.2" fill="#57606a">详见详细图①</text>
  <rect x="1560" y="96" width="180" height="127" fill="#fffdf4" stroke="#a8791b" stroke-width="1.5" rx="6"/>
  <rect x="1560" y="96" width="180" height="26" fill="#fdeeca" stroke="#a8791b" stroke-width="1.5" rx="6"/>
  <rect x="1561" y="113" width="178" height="10" fill="#fdeeca"/>
  <text x="1570" y="114" font-size="12.5" font-weight="bold" fill="#1f2328">MavLinkLink  «链路 · 简引用»</text>
  <text x="1572" y="130" font-size="11" fill="#1f2328">- onFrame(f)</text>
  <text x="1572" y="145.5" font-size="11" fill="#1f2328">- feedShell(chunk)</text>
  <line x1="1560" y1="162" x2="1740" y2="162" stroke="#a8791b" stroke-width="1"/>
  <text x="1572" y="167" font-size="10.2" fill="#57606a">«链路 · 消费者»</text>
  <text x="1572" y="182" font-size="10.2" fill="#57606a">详见详细图①</text>
  <rect x="740" y="560" width="560" height="249" fill="#fbf7fe" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="740" y="560" width="560" height="26" fill="#f3e8fd" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="741" y="577" width="558" height="10" fill="#f3e8fd"/>
  <text x="750" y="578" font-size="12.5" font-weight="bold" fill="#1f2328">MavLink.Parser  «嵌套 · 帧解析状态机»</text>
  <text x="752" y="594" font-size="11" fill="#1f2328">- buf: ByteArrayOutputStream {final}</text>
  <text x="752" y="609.5" font-size="11" fill="#1f2328">- state: int = 0   // 帧解析状态机</text>
  <text x="752" y="625" font-size="11" fill="#1f2328">- proto / payloadLen / msgid / sysid / compid / incompat</text>
  <text x="752" y="640.5" font-size="11" fill="#1f2328">- payload255: byte[] {final}</text>
  <line x1="740" y1="657" x2="1300" y2="657" stroke="#7a4fb5" stroke-width="1"/>
  <text x="752" y="664" font-size="11" fill="#1f2328">+ feed(data: byte[], off: int, len: int,</text>
  <text x="752" y="679.5" font-size="11" fill="#1f2328">       out: Consumer&lt;Frame&gt;): void</text>
  <text x="752" y="695" font-size="11" fill="#1f2328">- step(b: int, out): void   {private}</text>
  <text x="752" y="710.5" font-size="11" fill="#1f2328">- fill(a, off, len): void   {private}</text>
  <text x="752" y="726" font-size="11" fill="#1f2328">- reset(): void   {private}</text>
  <text x="752" y="741.5" font-size="11" fill="#1f2328">- learnV1(a, n, msgid, want) / learnV2(..) {private}</text>
  <text x="752" y="761" font-size="10.2" fill="#57606a">字节流 → 帧的状态机：v1（0xFE 魔数）与 v2（0xFD）双协议；</text>
  <text x="752" y="776" font-size="10.2" fill="#57606a">未知方言先解析再学习 CRC_EXTRA（learn*），连续确认后锁定</text>
  <rect x="1340" y="560" width="200" height="158" fill="#fbf7fe" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="1340" y="560" width="200" height="26" fill="#f3e8fd" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="1341" y="577" width="198" height="10" fill="#f3e8fd"/>
  <text x="1350" y="578" font-size="12.5" font-weight="bold" fill="#1f2328">MavLink.Frame  «嵌套 · 帧»</text>
  <text x="1352" y="594" font-size="11" fill="#1f2328">+ msgid: int {final}</text>
  <text x="1352" y="609.5" font-size="11" fill="#1f2328">+ sysid: int {final}</text>
  <text x="1352" y="625" font-size="11" fill="#1f2328">+ compid: int {final}</text>
  <text x="1352" y="640.5" font-size="11" fill="#1f2328">+ payload: byte[] {final}</text>
  <line x1="1340" y1="657" x2="1540" y2="657" stroke="#7a4fb5" stroke-width="1"/>
  <text x="1352" y="662" font-size="10.2" fill="#57606a">«值对象» 解析产物；</text>
  <text x="1352" y="677" font-size="10.2" fill="#57606a">包级构造（工具内使用）</text>
  <rect x="1560" y="560" width="180" height="187" fill="#fbf7fe" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="1560" y="560" width="180" height="26" fill="#f3e8fd" stroke="#7a4fb5" stroke-width="1.5" rx="6"/>
  <rect x="1561" y="577" width="178" height="10" fill="#f3e8fd"/>
  <text x="1570" y="578" font-size="12.5" font-weight="bold" fill="#1f2328">MavLink.PBuf  «嵌套 · PBuf»</text>
  <text x="1572" y="594" font-size="11" fill="#1f2328">- b: byte[255] {final}</text>
  <text x="1572" y="609.5" font-size="11" fill="#1f2328">- n: int</text>
  <line x1="1560" y1="626" x2="1740" y2="626" stroke="#7a4fb5" stroke-width="1"/>
  <text x="1572" y="633" font-size="11" fill="#1f2328">+ u8 / u16 / u32 / s16 / f32(v)</text>
  <text x="1572" y="648.5" font-size="11" fill="#1f2328">+ ascii(s, fixed) / bytes(d, len)</text>
  <text x="1572" y="664" font-size="11" fill="#1f2328">+ size(): int  + toArray(): byte[]</text>
  <text x="1572" y="679.5" font-size="11" fill="#1f2328">+ packFloat / packShort / packUShort</text>
  <text x="1572" y="699" font-size="10.2" fill="#57606a">«嵌套 · 载荷构建器»</text>
  <text x="1572" y="714" font-size="10.2" fill="#57606a">流式 API 链式打包</text>
  <rect x="60" y="950" width="860" height="282.5" fill="#f6fcf7" stroke="#2f8a4e" stroke-width="1.5" rx="6"/>
  <rect x="60" y="950" width="860" height="26" fill="#e4f4e8" stroke="#2f8a4e" stroke-width="1.5" rx="6"/>
  <rect x="61" y="967" width="858" height="10" fill="#e4f4e8"/>
  <text x="70" y="968" font-size="12.5" font-weight="bold" fill="#1f2328">解析结果值对象群（全部为不可变 record）  «值对象 · 解析产物»</text>
  <text x="72" y="984" font-size="11" fill="#1f2328">«record» Euler(rollDeg, pitchDeg, yawDeg: double)</text>
  <text x="72" y="999.5" font-size="11" fill="#1f2328">«record» Quat(qw, qx, qy, qz: double)</text>
  <text x="72" y="1015" font-size="11" fill="#1f2328">«record» Motors(frontRight, frontLeft, rearRight, rearLeft: double)</text>
  <text x="72" y="1030.5" font-size="11" fill="#1f2328">«record» RcData(channels: int[], roll, pitch, yaw, throttle: double,</text>
  <text x="72" y="1046" font-size="11" fill="#1f2328">        modeName, controlSource: String, time: double)</text>
  <text x="72" y="1061.5" font-size="11" fill="#1f2328">«record» ImuData(status, model: String, gyro, acc: double[], landed: boolean)</text>
  <text x="72" y="1077" font-size="11" fill="#1f2328">«record» StatusData(armed: boolean, controlSource: String, rcLinkUp / webLinkUp /</text>
  <text x="72" y="1092.5" font-size="11" fill="#1f2328">        mavLinkUp / isAirborne / landed / baro / range / hasAltitude / magOk: boolean,</text>
  <text x="72" y="1108" font-size="11" fill="#1f2328">        loopRate / crsfLinkQuality: Integer, armingDisabled / phase: String,</text>
  <text x="72" y="1123.5" font-size="11" fill="#1f2328">        batteryVoltage: double, altitude / tofStatus / temperatureC /</text>
  <text x="72" y="1139" font-size="11" fill="#1f2328">        humidityPct / pressureHpa: 包装类型)</text>
  <text x="72" y="1154.5" font-size="11" fill="#1f2328">«record» SysData(chip: String, freeHeap: Long, loopRate: Integer, …)</text>
  <text x="72" y="1170" font-size="11" fill="#1f2328">«record» WifiData(mode, ssid, ip: String, mavlinkConnected: boolean)</text>
  <line x1="60" y1="1186.5" x2="920" y2="1186.5" stroke="#2f8a4e" stroke-width="1"/>
  <text x="72" y="1191.5" font-size="10.2" fill="#57606a">一次解析产出一个不可变记录；字段缺失即 NaN/false，由 LiveVehicle 的 NaN 不覆盖语义兜底</text>
