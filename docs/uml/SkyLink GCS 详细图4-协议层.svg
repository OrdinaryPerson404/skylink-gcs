  <text x="972" y="999.5" font-size="11" fill="#1f2328">  的权威编解码向量（16 例）</text>
  <text x="972" y="1015" font-size="11" fill="#1f2328">- 覆盖：v1/v2 帧、CRC_EXTRA 累加、</text>
  <text x="972" y="1030.5" font-size="11" fill="#1f2328">  字段序（尺寸降序）、v2 截断扩展、</text>
  <text x="972" y="1046" font-size="11" fill="#1f2328">  旧方言 extras 自适应学习</text>
