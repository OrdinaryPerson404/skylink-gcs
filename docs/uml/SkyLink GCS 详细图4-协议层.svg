<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1310" viewBox="0 0 1780 1310" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrowOpen" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10" fill="none" stroke="#444" stroke-width="1.4"/>
    </marker>
    <marker id="triHollow" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse">
