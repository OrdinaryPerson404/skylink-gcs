  <text x="74" y="588" font-size="11" fill="#1f2328">MAVLink v1 帧：0xFE | len | seq |</text>
  <text x="74" y="612" font-size="11" fill="#1f2328">sysid | compid | msgid | payload</text>
  <text x="74" y="636" font-size="11" fill="#1f2328">| CRC_lo | CRC_hi（整帧参与，</text>
  <text x="74" y="660" font-size="11" fill="#1f2328">  再累加 CRC_EXTRA）</text>
  <text x="74" y="684" font-size="11" fill="#1f2328">CLI 无帧界：预算+解析满足即止</text>
  <rect x="40" y="1180" width="1700" height="108" fill="#fbfcfe" stroke="#8c959f" rx="4"/>
  <text x="54" y="1202" font-size="12" font-weight="bold" fill="#1f2328">协议层走读（字节/文本 → 结构化数据）</text>
  <text x="54" y="1224" font-size="11" fill="#1f2328">① CLI 路径：串口行 → CliLink.completeFor 判定响应结束（每命令预算，如 status 800ms / p 全量 2600ms）→ apply() → CliProtocol.parseX() → record → Builder</text>
  <text x="54" y="1244" font-size="11" fill="#1f2328">② MAVLink 路径：UDP 数据报 → MavLink.Parser.feed 状态机 → Frame → onFrame 按 msgid 分派（姿态四元数/IMU/RC/执行器/SERIAL_CONTROL/ACK/PARAM_VALUE）</text>
  <text x="54" y="1264" font-size="11" fill="#1f2328">③ SERIAL_CONTROL 桥：MavLink.payloadSerialControlShell 把 CLI 命令装进 MAVLink 下行，回包 feedShell 按 CLI 文本再解析——两条协议在此互通</text>
  <text x="54" y="1284" font-size="11" fill="#1f2328">④ 权威性保障：CLI 以真机抓包为黄金样本（CliProtocolTest 10 例），MAVLink 以 pymavlink 向量为黄金帧（MavCodecTest 16 例）——全部常绿</text>
